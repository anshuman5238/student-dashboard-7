<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <h1>Student Dashboard</h1>

        <!-- Input fields for typing new student details -->
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Enter name">
            <input type="number" id="ageInput" placeholder="Enter age">
            <input type="text" id="courseInput" placeholder="Enter course">
        </div>

        <div class="btn-container">
            <button id="showBtn">Show Students</button>
            <button id="addBtn">Add Student</button>
            <button id="themeBtn">Change Theme</button>
        </div>

        <p id="msg"></p>

        <!-- Student cards will show up here -->
        <div id="studentContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
